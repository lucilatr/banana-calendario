<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Airways — Plan de Producción a Lanzamiento (31 Mar 2027)</title>
<style>
  :root{
    --label-w: 248px;
    --col-w: 70px;
    --bg: #ffffff;
    --panel: #f6f7f9;
    --grid: #e7e9ee;
    --gridStrong:#d3d7e0;
    --text: #1d2330;
    --muted: #6b7280;
    --today: rgba(255,196,0,.16);
    --todayLine:#f0a500;
    --row-h: 34px;
    /* workstream accents */
    --c-dev-a:#0f9d8f;  --c-dev-b:#2bc4b4;
    --c-art-a:#5b5bd6;  --c-art-b:#8a7bff;
    --c-mkt-a:#e08900;  --c-mkt-b:#ffb43d;
    --c-port-a:#d23b5a; --c-port-b:#ff6b84;
    --c-qa-a:#2e7d32;   --c-qa-b:#5bb85f;
    --c-sys-a:#2563c9;  --c-sys-b:#4f8bf0;
    --c-def-a:#c0398f;  --c-def-b:#e06bb0;
    --c-mile:#1d2330;
    --c-launch:#f0a500;
  }
  body.dark{
    --bg:#0f1420; --panel:#161c2b; --grid:#232b3d; --gridStrong:#2e3850;
    --text:#e7ecf5; --muted:#93a0b8; --today:rgba(255,196,0,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
  }
  .wrap{max-width:100%;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
  .title h1{margin:0 0 4px;font-size:22px;letter-spacing:.2px;}
  .title .sub{color:var(--muted);font-size:13px;}
  .title .chip{display:inline-block;margin-top:8px;margin-right:6px;font-size:12px;font-weight:600;color:#fff;background:var(--c-launch);padding:3px 10px;border-radius:999px;}
  .title .chip.cd{background:var(--c-dev-a);}
  .legend.hidden{display:none;}
  .controls{display:flex;gap:8px;align-items:center;}
  .btn{cursor:pointer;border:1px solid var(--gridStrong);background:var(--panel);color:var(--text);
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;transition:.15s;}
  .btn:hover{border-color:var(--c-art-a);}

  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:4px 0 14px;padding:11px 16px;
    font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:10px;}
  .legend .k{display:inline-flex;align-items:center;gap:6px;color:var(--muted);}
  .legend .sw{width:13px;height:13px;border-radius:4px;display:inline-block;}
  .sw.dev{background:linear-gradient(90deg,var(--c-dev-a),var(--c-dev-b));}
  .sw.art{background:linear-gradient(90deg,var(--c-art-a),var(--c-art-b));}
  .sw.mkt{background:linear-gradient(90deg,var(--c-mkt-a),var(--c-mkt-b));}
  .sw.port{background:linear-gradient(90deg,var(--c-port-a),var(--c-port-b));}
  .sw.qa{background:linear-gradient(90deg,var(--c-qa-a),var(--c-qa-b));}
  .sw.sys{background:linear-gradient(90deg,var(--c-sys-a),var(--c-sys-b));}
  .sw.def{background:linear-gradient(90deg,var(--c-def-a),var(--c-def-b));}
  .sw.snd{background:linear-gradient(90deg,#0ea5b7,#49c6d6);}
  .dmd{width:11px;height:11px;background:var(--c-mile);transform:rotate(45deg);display:inline-block;}

  .chart{border:1px solid var(--grid);border-radius:12px;background:var(--panel);overflow:auto;max-height:80vh;}
  .grid24{display:grid;grid-template-columns:var(--label-w) repeat(23,var(--col-w));width:max-content;min-width:100%;}
  /* sticky date header (stays fixed on vertical scroll) + fixed left name column (on horizontal scroll) */
  .stickyHead{position:sticky;top:0;z-index:20;background:var(--panel);width:max-content;min-width:100%;
    border-top-left-radius:12px;border-top-right-radius:12px;box-shadow:0 3px 6px rgba(0,0,0,.10);}
  .months .corner,.weeks .corner{position:sticky;left:0;z-index:23;background:var(--panel);}
  .months .cell{border-left:1px solid var(--grid);padding:8px 6px;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);background:var(--panel);}
  .months .corner{border-left:none;text-align:left;font-weight:700;color:var(--text);letter-spacing:.3px;font-size:12px;}
  /* week header */
  .weeks .cell{border-left:1px solid var(--grid);border-top:1px solid var(--grid);padding:5px 2px;text-align:center;font-size:9.5px;color:var(--muted);background:var(--panel);white-space:nowrap;}
  .weeks .corner{border-left:none;}
  .weeks .cell.today{background:var(--today);color:var(--todayLine);font-weight:700;}

  .grpTitle{grid-column:1 / -1;padding:7px 0;font-size:11px;font-weight:800;letter-spacing:.8px;
    color:var(--text);background:var(--grid);border-top:1px solid var(--gridStrong);cursor:pointer;}
  .grpTitle:hover{background:var(--gridStrong);}
  .grpTitle .gt{position:sticky;left:0;z-index:6;display:inline-block;padding-left:14px;padding-right:12px;background:var(--grid);}
  .grpTitle .gcaret{font-size:9px;color:var(--muted);margin-right:3px;}
  .row{min-height:var(--row-h);border-top:1px solid var(--grid);position:relative;}
  .row .name{grid-column:1;display:flex;align-items:center;padding:4px 10px 4px 14px;font-size:11.5px;line-height:1.2;
    position:sticky;left:0;z-index:8;background:var(--panel);border-right:1px solid var(--grid);}
  .row .name.warn::before{content:"⚠";margin-right:6px;}
  /* week separators as background */
  /* vertical column lines (week + day boundaries) drawn as overlays for exact alignment */
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);pointer-events:none;z-index:0;}
  .vline.day{opacity:.5;}
  .wkndcol{position:absolute;top:0;bottom:0;background:rgba(128,134,150,.15);pointer-events:none;z-index:0;}
  .blockedrow{position:absolute;left:var(--label-w);right:0;top:0;bottom:0;background:rgba(128,134,150,.22);pointer-events:none;z-index:1;}
  .row.lvl.blocked .name{color:var(--muted);}
  .bar{align-self:center;height:21px;border-radius:8px;display:flex;align-items:center;
    padding:0 8px;box-shadow:0 1px 2px rgba(0,0,0,.14);margin:5px 2px;z-index:2;overflow:hidden;}
  /* label inside a wide bar (white, fits) */
  .inlbl{color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inlbl.sm{font-size:9.5px;}
  /* full label beside a narrow bar (dark, never cut) */
  .outlbl{align-self:center;display:flex;align-items:center;font-size:10.5px;font-weight:500;
    color:var(--text);white-space:nowrap;z-index:1;pointer-events:none;}
  .outlbl.r{justify-self:start;padding-left:8px;}
  .outlbl.l{justify-self:end;padding-right:8px;text-align:right;}
  .outlbl.sm{font-size:9.5px;}
  .outlbl .dur{color:var(--muted);font-weight:600;margin-left:7px;font-size:9.5px;}
  .outlbl .ph{color:var(--muted);font-weight:600;}
  .bar.dev{background:linear-gradient(90deg,var(--c-dev-a),var(--c-dev-b));}
  .bar.art{background:linear-gradient(90deg,var(--c-art-a),var(--c-art-b));}
  .bar.mkt{background:linear-gradient(90deg,var(--c-mkt-a),var(--c-mkt-b));}
  .bar.port{background:linear-gradient(90deg,var(--c-port-a),var(--c-port-b));}
  .bar.qa{background:linear-gradient(90deg,var(--c-qa-a),var(--c-qa-b));}
  .bar.sys{background:linear-gradient(90deg,var(--c-sys-a),var(--c-sys-b));}
  .bar.def{background:linear-gradient(90deg,var(--c-def-a),var(--c-def-b));}
  .bar.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--gridStrong);}
  /* level rows: 3 steps (A layout+jugabilidad · Lock+def · B look&impl) */
  .row.lvl{min-height:38px;}
  .row.lvl .name{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding-top:5px;padding-bottom:5px;}
  .row.lvl .name strong{font-size:11.5px;}
  .row.lvl .name .mech{font-size:9px;color:var(--muted);line-height:1.1;}
  /* day-precise absolute bars (10px/day) + beside labels */
  .abar{position:absolute;top:50%;transform:translateY(-50%);height:19px;border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.16);z-index:2;}
  .albl{position:absolute;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:500;color:var(--text);white-space:nowrap;z-index:1;pointer-events:none;padding-left:7px;opacity:0;transition:opacity .12s;}
  .albl .ph{color:var(--muted);font-weight:600;}
  .abar:hover + .albl{opacity:1;}
  /* resize handles on Fase A (green) bars */
  .handle{position:absolute;top:0;bottom:0;width:11px;cursor:ew-resize;z-index:4;}
  .handle.l{left:-3px;} .handle.r{right:-3px;}
  .handle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:11px;border-radius:2px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.2);}
  body.dragging{user-select:none;cursor:ew-resize;}
  /* expandable level name (caret) + difficulty sub-rows */
  .row.lvl .name.lvlname{flex-direction:row;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer;}
  .lvlname .caret{color:var(--muted);font-size:9px;display:inline-block;transition:transform .15s;flex:none;}
  .lvlname.open .caret{transform:rotate(90deg);}
  .lvlname .col{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .diffrow{min-height:28px;}
  .diffrow .name{padding-left:30px;font-size:10px;color:var(--muted);}
  .diffrow .name .dk{font-weight:800;color:var(--text);}
  /* expandable weeks: click to widen a week and show its 7 days as sub-columns */
  .weeks .cell.wk{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .weeks .cell.wk:hover{background:var(--grid);}
  .weeks .cell.wk.exp{padding:0;background:rgba(43,99,201,.07);justify-content:flex-start;}
  .wnum{font-size:8px;font-weight:800;color:var(--c-sys-a);letter-spacing:.3px;}
  .wdate{font-size:9.5px;}
  .cell.wk.exp .wnum{width:100%;text-align:center;padding:3px 0;border-bottom:1px solid var(--grid);}
  .daygrid{display:grid;grid-template-columns:repeat(7,1fr);width:100%;}
  .daycell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;
    border-left:1px solid var(--grid);font-size:7.5px;color:var(--muted);line-height:1;}
  .daycell:first-child{border-left:none;}
  .daycell b{font-size:10px;color:var(--text);font-weight:700;}
  .daycell.wknd{background:rgba(128,134,150,.16);}
  .daycell.hol{background:rgba(240,165,0,.16);}
  .daycell.hol b{color:var(--c-launch);}
  .daycell.todayd{background:rgba(240,165,0,.24);}
  .daycell.todayd b{color:var(--todayLine);}
  /* current day highlighted inside an expanded week */
  .todaycol{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1;background:rgba(240,165,0,.16);
    border-left:2px solid var(--todayLine);border-right:1px solid var(--todayLine);}
  /* colored block for an expanded week across all rows, with day separators */
  .weekband{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0;
    background-color:rgba(43,99,201,.05);border-left:2px solid var(--c-sys-a);border-right:1px solid var(--gridStrong);}
  /* milestones: diamond icon with number on top, text below, all aligned */
  .mrow{min-height:104px;}
  .mrow .name{align-items:center;font-weight:800;letter-spacing:.4px;}
  .mrow::after{content:"";position:absolute;left:var(--label-w);right:0;top:22px;height:2px;background:var(--grid);z-index:0;}
  .mile{position:absolute;top:11px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:3;}
  .mile .d{width:22px;height:22px;transform:rotate(45deg);border-radius:5px;background:var(--c-mile);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);border:2px solid var(--panel);}
  .mile .d span{transform:rotate(-45deg);color:#fff;font-size:9.5px;font-weight:800;line-height:1;}
  .mile.launch .d{width:27px;height:27px;background:var(--c-launch);}
  .mile.launch .d span{font-size:13px;}
  .mile .t{margin-top:9px;text-align:center;font-size:10.5px;font-weight:400;color:var(--text);line-height:1.2;max-width:96px;}
  .mile .t.oneline{max-width:none;}
  .mile .t .mt{display:block;white-space:normal;}
  .mile .t.oneline .mt{white-space:nowrap;}
  .mile .t .ms{display:block;white-space:nowrap;font-weight:400;color:var(--muted);font-size:10px;margin-top:1px;}
  .mile.launch .t .mt{color:var(--c-launch);}
  /* milestones muy cercanos: texto ABAJO del número, anclado al borde del punto */
  .mile.edge .t{position:absolute;top:31px;margin-top:0;max-width:78px;}
  .mile.edge .t .mt{white-space:normal;}
  .mile.edge.side-l .t{right:11px;text-align:right;}
  .mile.edge.side-r .t{left:11px;text-align:left;}
  /* today vertical band across the whole chart */
  #rows{position:relative;}
  .todayband{position:absolute;top:0;bottom:0;width:var(--col-w);background:var(--today);
    border-left:2px solid var(--todayLine);pointer-events:none;z-index:1;}

  .notes{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
  .card{border:1px solid var(--grid);border-radius:12px;padding:14px 16px;background:var(--panel);}
  .card h3{margin:0 0 8px;font-size:13px;}
  .card.urgent{border-color:var(--c-port-a);}
  .card.urgent h3{color:var(--c-port-a);}
  .card.risk{border-color:var(--c-mkt-a);}
  .card.risk h3{color:var(--c-mkt-a);}
  .card ul{margin:0;padding-left:18px;}
  .card li{font-size:12px;line-height:1.5;margin-bottom:5px;color:var(--text);}
  .foot{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.5;}
  .hideEN [data-en]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1 data-es="Banana Airways" data-en="Banana Airways">Banana Airways</h1>
      <div class="sub" data-es="Proyección octubre 2026 al 31 de marzo de 2027" data-en="Projection October 2026 to March 31, 2027">Proyección octubre 2026 al 31 de marzo de 2027</div>
      <span class="chip" data-es="🚀 Lanzamiento 31 de marzo de 2027" data-en="🚀 Launch March 31, 2027">🚀 Lanzamiento 31 de marzo de 2027</span>
      <span class="chip cd" id="countdown"></span>
    </div>
    <div class="controls">
      <button class="btn" id="pubBtn" style="display:none;border-color:var(--c-dev-a);color:var(--c-dev-a);font-weight:700;">⬆️ Publicar</button>
      <span id="pubStatus" style="display:none;font-size:11px;color:var(--c-dev-a);font-weight:700;align-self:center;white-space:nowrap;"></span>

  <div class="legend hidden" id="legend"></div>

  <div class="chart">
    <div class="stickyHead">
      <div class="grid24 months" id="months"></div>
      <div class="grid24 weeks" id="weeks"></div>
    </div>
    <div id="rows"></div>
  </div>

  <div class="notes" id="notes"></div>

  <div class="foot" data-es="Preview interno — no publicado. Fechas y supuestos derivados de la reunión y de prácticas estándar de producción de videojuegos (dev programs y certificación de consolas). Ajustable." data-en="Internal preview — not published. Dates and assumptions derived from the meeting and standard game-production practice (dev programs & console certification). Adjustable.">Preview interno — no publicado.</div>

let lang='es';
const $=(s)=>document.querySelector(s);
const col=(w)=>`${w+1}`; // week w -> grid column index

// ---- day computation for expandable weeks ----
const DOW={es:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], en:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']};
const MO3={es:['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'], en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const START=new Date(2026,9,26); // lunes 26 Oct 2026
const HOLIDAYS={'2026-12-25':{es:'Navidad',en:'Christmas'}, '2027-01-01':{es:'Año Nuevo',en:'New Year'}};
const iso=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekDays(w){ const a=[]; const b=new Date(START); b.setDate(b.getDate()+(w-1)*7); for(let i=0;i<7;i++){ const d=new Date(b); d.setDate(d.getDate()+i); a.push(d);} return a; }
// ---- day-precise positioning with per-week horizontal expansion ----
const LABELW=248, COLW=70, DAYW=40; const EXPW=7*DAYW; // expanded week width
let expandedWk=new Set();
const dOff=(iso)=>Math.round((new Date(iso+'T00:00:00')-START)/86400000);
const TODAY_ISO='2026-10-27'; const TODAY_OFF=dOff(TODAY_ISO);
function weekWidth(w){ return expandedWk.has(w)?EXPW:COLW; }
function gridTemplate(){ let s='var(--label-w)'; for(let w=1;w<=23;w++) s+= expandedWk.has(w)?` ${EXPW}px`:' var(--col-w)'; return s; }
function weekStartX(w){ let x=LABELW; for(let i=1;i<w;i++) x+=weekWidth(i); return x; }
function dayToX(o){ const w=Math.floor(o/7)+1, din=o-(w-1)*7; return weekStartX(w)+(weekWidth(w)/7)*din; }
function barPx(o,eIncl){ const l=dayToX(o); return {l, w:dayToX(eIncl+1)-l}; }
function applyGrid(){ let st=document.getElementById('gstyle'); if(!st){ st=document.createElement('style'); st.id='gstyle'; document.head.appendChild(st); } st.textContent=`.grid24{grid-template-columns:${gridTemplate()};}`; }
function fmtRange(s,e){ const a=new Date(s+'T00:00:00'),b=new Date(e+'T00:00:00'); return `${a.getDate()} ${MO3[lang][a.getMonth()]} – ${b.getDate()} ${MO3[lang][b.getMonth()]}`; }
function fmtDate(s){ const a=new Date(s+'T00:00:00'); return `${a.getDate()} ${MO3[lang][a.getMonth()]}`; }
const gr=(a,b)=>`linear-gradient(90deg,var(${a}),var(${b}))`;
const COLOR={dev:gr('--c-dev-a','--c-dev-b'),art:gr('--c-art-a','--c-art-b'),def:gr('--c-def-a','--c-def-b'),sys:gr('--c-sys-a','--c-sys-b'),mkt:gr('--c-mkt-a','--c-mkt-b'),port:gr('--c-port-a','--c-port-b'),qa:gr('--c-qa-a','--c-qa-b')};
const FROZEN='linear-gradient(90deg,#9aa1ad,#b8bec9)';
const DIFFS=[{es:'Easy',en:'Easy',c:'#86d3a0'},{es:'Medium',en:'Medium',c:'#4faf77'},{es:'Hard',en:'Hard',c:'#2b7d50'}];
const SND='linear-gradient(90deg,#0ea5b7,#49c6d6)';
const PROD='linear-gradient(90deg,#7e8796,#aab2bf)';
const PHASES=[{k:'assets',cls:'art',es:'Pulido de look',en:'Look polish',grad:COLOR.art},{k:'vfx',cls:'def',es:'VFX + Lighting',en:'VFX + Lighting',grad:COLOR.def},{k:'snd',cls:'snd',es:'Sonido',en:'Sound',grad:SND}];
let expandedLv=new Set();
let collapsedGrp=new Set();

  document.querySelectorAll('.diffrow').forEach(r=>{ r.style.display = expandedLv.has(r.dataset.lvl)?'':'none'; });

// ---- persistencia / publicación (GitHub) ----
const GH={owner:'lucilatr', repo:'banana-calendario', branch:'main', path:'data.json'};
const EDITABLE = location.protocol==='file:' || location.search.includes('edit') || location.hash.includes('edit');
let barOverrides={}, lastPublished=null;
function saveOverrides(){ try{ localStorage.setItem('banana_bars',JSON.stringify(barOverrides)); }catch(e){} }
function fmtTs(iso){ try{ return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function showPubStatus(txt){ const ps=$('#pubStatus'); if(ps){ ps.style.display=''; ps.textContent=txt; } }
async function loadState(){
  try{ const r=await fetch(GH.path+'?t='+Date.now(),{cache:'no-store'}); if(r.ok){ const d=await r.json(); barOverrides=(d&&d.barOverrides)||{}; lastPublished=(d&&d.updated)||null; return; } }catch(e){}
  try{ barOverrides=JSON.parse(localStorage.getItem('banana_bars')||'{}'); }catch(e){}
}
async function publish(){
  let token=localStorage.getItem('banana_gh_token');
  if(!token){ token=prompt('Pegá tu token de GitHub (con permiso de repo). Solo queda en este navegador:'); if(!token) return; localStorage.setItem('banana_gh_token',token); }
  const btn=$('#pubBtn'), old=btn?btn.textContent:'';
  if(btn) btn.textContent='Publicando…';
  const state={version:1, updated:new Date().toISOString(), barOverrides};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))));
  const api=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
  try{
    let sha; const g=await fetch(api+`?ref=${GH.branch}`,{headers:{Authorization:'token '+token}}); if(g.ok) sha=(await g.json()).sha;
    const res=await fetch(api,{method:'PUT',headers:{Authorization:'token '+token,'Accept':'application/vnd.github+json'},body:JSON.stringify({message:'Publicar calendario',content,sha,branch:GH.branch})});
    if(res.ok){ if(btn) btn.textContent=old; const t=new Date(); showPubStatus('✅ Publicado '+t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · visible en ~1 min'); }
    else { const e=await res.json().catch(()=>({})); if(res.status===401) localStorage.removeItem('banana_gh_token'); alert('Error al publicar: '+res.status+' '+(e.message||'')); if(btn) btn.textContent=old; }
  }catch(err){ alert('Error de red al publicar: '+err); if(btn) btn.textContent=old; }
}
function curOff(key,defS,defE){ const o=barOverrides[key]; return o?[dOff(o.s),dOff(o.e)]:[defS,defE]; }
function offToIso(off){ const d=new Date(START); d.setDate(d.getDate()+Math.max(0,Math.min(160,off))); return iso(d); }
function xToDay(x){ x-=LABELW; if(x<0)x=0; for(let w=1;w<=23;w++){ const ww=weekWidth(w); if(x<ww){ return (w-1)*7+Math.max(0,Math.min(6,Math.floor(x/(ww/7)))); } x-=ww; } return 160; }
// draw a stretchable bar (abar) with both-end handles; optional hover label to the right
function drawBar(key,defS,defE,grad,title,labelHtml,noDrag){
  noDrag = noDrag || !EDITABLE;
  const [s,e]=curOff(key,defS,defE), p=barPx(s,e);
  const handles = noDrag?'':`<div class="handle l"></div><div class="handle r"></div>`;
  let h=`<div class="abar ${noDrag?'':'drag'}" data-key="${key}" data-soff="${s}" data-eoff="${e}" style="left:${p.l}px;width:${p.w}px;background:${grad}" title="${title}">${handles}</div>`;
  if(labelHtml) h+=`<div class="albl" data-key="${key}" style="left:${dayToX(e+1)}px">${labelHtml}</div>`;
  return h;
}

function updateCountdown(){
  const el=$('#countdown'); if(!el) return;
  const target=new Date(2026,10,13); target.setHours(0,0,0,0); // 13 Nov 2026 (1 sem antes del submit)
  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.round((target-now)/86400000);
  if(days>1) el.textContent = lang==='es'?`⏳ Faltan ${days} días para el trailer listo (1 sem antes del submit · 13 Nov)`:`⏳ ${days} days to trailer ready (1 wk before submit · Nov 13)`;
  else if(days===1) el.textContent = lang==='es'?'⏳ Falta 1 día para el trailer listo (13 Nov)':'⏳ 1 day to trailer ready (Nov 13)';
  else if(days===0) el.textContent = lang==='es'?'⏳ Trailer listo HOY (13 Nov)':'⏳ Trailer ready TODAY (Nov 13)';
  else el.textContent = lang==='es'?'Trailer: submit 20 Nov':'Trailer: submit Nov 20';
}
function render(){
  applyGrid();
  // legend
  $('#legend').innerHTML=[
    ['dev', lang==='es'?'Exploración (layout · jugabilidad · dinámicas)':'Exploration (layout · gameplay · dynamics)'],
    ['art', lang==='es'?'Pulido de look':'Look polish'],
    ['def', lang==='es'?'VFX + Lighting':'VFX + Lighting'],
    ['snd', lang==='es'?'Sonido':'Sound'],
    ['sys', lang==='es'?'Sistemas & Pipeline':'Systems & Pipeline'],
    ['mkt', lang==='es'?'Marketing & Comunidad':'Marketing & Community'],
    ['port',lang==='es'?'Porting a Consolas':'Console Porting'],
    ['qa',  lang==='es'?'QA & Lanzamiento':'QA & Launch'],
  ].map(([c,t,col])=>`<span class="k"><span class="sw ${c}" ${col?`style="background:${col}"`:''}></span>${t}</span>`).join('')
   +`<span class="k"><span class="dmd"></span>Milestone</span>`
   +`<span class="k" style="color:var(--todayLine);font-weight:700;">▸ ${lang==='es'?'Clic en una semana = desplegar días + agregar tareas':'Click a week = expand days + add tasks'}</span>`
   +`<span class="k" style="color:var(--c-art-a);font-weight:700;">▸ ${lang==='es'?'Clic en un nivel = etapas A/B/C/D (pueden solaparse)':'Click a level = stages A/B/C/D (can overlap)'}</span>`;

  // months
  let m=`<div class="cell corner">${lang==='es'?'2026 — 2027':'2026 — 2027'}</div>`;
  MONTHS.forEach(([es,en,span])=>{ m+=`<div class="cell" style="grid-column:span ${span}">${lang==='es'?es:en} ${es==='OCT'||es==='NOV'||es==='DIC'?'’26':'’27'}</div>`; });
  $('#months').innerHTML=m;

  // weeks (clickable → expand to show days)
  const W= lang==='es'?WEEKS_ES:WEEKS_EN;
  let wk=`<div class="cell corner"></div>`;
  const SW='W';
  W.forEach((d,i)=>{
    const w=i+1;
    if(expandedWk.has(w)){
      let inner='';
      weekDays(w).forEach(dd=>{ const jd=dd.getDay(), we=(jd===0||jd===6), ho=HOLIDAYS[iso(dd)], tod=iso(dd)===TODAY_ISO;
        inner+=`<div class="daycell ${tod?'todayd':(ho?'hol':(we?'wknd':''))}"><span>${DOW[lang][(jd+6)%7]}</span><b>${dd.getDate()}</b></div>`; });
      wk+=`<div class="cell wk exp" data-w="${w}"><div class="wnum">${SW}${w}</div><div class="daygrid">${inner}</div></div>`;
    } else {
      const td=w===TODAY_WEEK?'today':'';
      wk+=`<div class="cell wk ${td}" data-w="${w}"><span class="wnum">${SW}${w}</span><span class="wdate">${d}</span></div>`;
    }
  });
  $('#weeks').innerHTML=wk;

  // rows
  let html='';
  GROUPS.forEach((g,gi)=>{
    const collapsed=collapsedGrp.has(gi);
    html+=`<div class="grid24"><div class="grpTitle" data-grp="${gi}"><span class="gt"><span class="gcaret">${collapsed?'▸':'▾'}</span>${lang==='es'?g.es:g.en}</span></div></div>`;
    if(collapsed) return;
    if(g.kind==='mile'){
      html+=`<div class="grid24 row mrow">`;
      g.tasks.forEach((t,idx)=>{
        const o=dOff(t.d), cx=(dayToX(o)+dayToX(o+1))/2;
        const sideCls=t.side?`edge side-${t.side}`:'';
        const main=lang==='es'?t.es:t.en, sub=lang==='es'?(t.sub_es||''):(t.sub_en||'');
        const tInner=`<span class="mt">${main}</span>${sub?`<span class="ms">${sub}</span>`:''}`;
        html+=`<div class="mile ${t.launch?'launch':''} ${sideCls}" style="left:${cx}px" title="${main}${sub?' · '+sub:''}"><div class="d"><span>${t.launch?'🚀':idx+1}</span></div><div class="t ${t.oneline?'oneline':''}">${tInner}</div></div>`;
      });
      html+=`<div class="name">${lang==='es'?g.es:g.en}</div></div>`;
    } else if(g.kind==='levels'){
      g.tasks.forEach(t=>{
        const nm=lang==='es'?t.es:t.en;
        if(t.blocked){
          html+=`<div class="grid24 row lvl blocked"><div class="blockedrow"></div><div class="name" title="${nm}"><strong>${nm}</strong></div></div>`;
          return;
        }
        const mech=lang==='es'?(t.mech_es||''):(t.mech_en||'');
        // fila principal del modo de juego (desplegable)
        html+=`<div class="grid24 row lvl">`;
        const lvlNameHtml=`<div class="name lvlname" data-lvl="${t.key}" title="${nm}"><span class="caret">▸</span><span class="col"><strong>${nm}</strong></span></div>`;
        // las 4 etapas del modo (A exploración · B assets · C vfx+light · D sonido)
        const exLbl=lang==='es'?'Exploración (layout · jugabilidad · dinámicas)':'Exploration (layout · gameplay · dynamics)';
        const o=t.b?(t.b[0]-1)*7:0, e=t.b?(t.b[1]-1)*7+4:0;
        const STAGES=[];
        if(t.aStart) STAGES.push({k:'exp_'+t.key, grad:COLOR.dev, lbl:exLbl, ds:dOff(t.aStart), de:dOff(t.aEnd)});
        if(t.b) PHASES.forEach(ph=>STAGES.push({k:ph.k+'_'+t.key, grad:ph.grad, lbl:(lang==='es'?ph.es:ph.en), ds:o, de:e}));
        // tira-resumen (toda la extensión del modo), no arrastrable, en la fila principal
        let smin=Infinity, smax=-Infinity;
        STAGES.forEach(st=>{ const [s,e2]=curOff(st.k, st.ds, st.de); smin=Math.min(smin,s); smax=Math.max(smax,e2); });
        if(STAGES.length){
          const sl=`${nm} · ${fmtRange(offToIso(smin),offToIso(smax))}`;
          html+=drawBar('sum_'+t.key, smin, smax, PROD, sl, sl, true);
        }
        html+=lvlNameHtml+`</div>`;
        // sub-filas: las 4 etapas como tiras independientes (ocultas hasta desplegar), pueden solaparse
        STAGES.forEach(st=>{
          html+=`<div class="grid24 row diffrow" data-lvl="${t.key}" style="display:none">`;
          html+=drawBar(st.k, st.ds, st.de, st.grad, st.lbl, st.lbl);
          html+=`<div class="name"><span class="dk">${st.lbl}</span></div></div>`;
        });
      });
    } else { // bars — nombre completo a la izquierda, barra estirable
      g.tasks.forEach((t,ti)=>{
        const label = lang==='es'?t.es:t.en;
        html+=`<div class="grid24 row">`+drawBar(`${gi}_${ti}`, (t.sw-1)*7, (t.ew-1)*7+6, COLOR[t.cls||g.cls], label, null)+`<div class="name ${t.warn?'warn':''}" title="${label}">${label}</div></div>`;
      });
    }
  });
  // colored block for expanded weeks (subtle)
  expandedWk.forEach(w=>{ html+=`<div class="weekband" style="left:${weekStartX(w)}px;width:${weekWidth(w)}px"></div>`; });
  // weekend gray columns (Sat+Sun) in expanded weeks
  let vx=LABELW;
  for(let w=1;w<=23;w++){ if(expandedWk.has(w)){ const dw=weekWidth(w)/7; html+=`<div class="wkndcol" style="left:${vx+5*dw}px;width:${2*dw}px"></div>`; } vx+=weekWidth(w); }
  // vertical lines: week boundaries always, day boundaries inside expanded weeks
  vx=LABELW;
  for(let w=1;w<=23;w++){ html+=`<div class="vline" style="left:${vx}px"></div>`; if(expandedWk.has(w)){ const dw=weekWidth(w)/7; for(let d=1;d<7;d++) html+=`<div class="vline day" style="left:${vx+d*dw}px"></div>`; } vx+=weekWidth(w); }
  html+=`<div class="vline" style="left:${vx}px"></div>`;
  // today: if its week is expanded, highlight just today's day column; else the whole week
  if(expandedWk.has(TODAY_WEEK)){ html+=`<div class="todaycol" style="left:${dayToX(TODAY_OFF)}px;width:${weekWidth(TODAY_WEEK)/7}px"></div>`; }
  else { html+=`<div class="todayband" style="left:${weekStartX(TODAY_WEEK)}px;width:${weekWidth(TODAY_WEEK)}px"></div>`; }
  $('#rows').innerHTML=html;

  // notes
  $('#notes').innerHTML=NOTES.map(n=>{
    const arr=lang==='es'?n.es:n.en;
    return `<div class="card ${n.cls}"><h3>${arr[0]}</h3><ul>${arr.slice(1).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }).join('');

  // swap static [data-es]/[data-en]
  document.querySelectorAll('[data-es]').forEach(el=>{ el.textContent = lang==='es'?el.dataset.es:el.dataset.en; });
  document.documentElement.lang=lang;
  $('#langBtn').textContent = lang==='es'?'EN':'ES';

  applyExpanded();
  updateCountdown();
}

// drag ANY bar from either end to resize it (snaps to day)
let drag=null;
document.addEventListener('mousedown',(e)=>{ const h=e.target.closest('.handle'); if(!h) return; const bar=h.closest('.abar'); if(!bar) return; e.preventDefault(); drag={key:bar.dataset.key,side:h.classList.contains('l')?'l':'r',sOff:+bar.dataset.soff,eOff:+bar.dataset.eoff,el:bar}; document.body.classList.add('dragging'); });
document.addEventListener('mousemove',(e)=>{ if(!drag) return; const chart=$('.chart'), r=chart.getBoundingClientRect(); const x=e.clientX-r.left+chart.scrollLeft; const off=xToDay(x); if(drag.side==='l') drag.sOff=Math.min(off,drag.eOff); else drag.eOff=Math.max(off,drag.sOff); const p=barPx(drag.sOff,drag.eOff); drag.el.style.left=p.l+'px'; drag.el.style.width=p.w+'px'; drag.el.dataset.soff=drag.sOff; drag.el.dataset.eoff=drag.eOff; const lbl=document.querySelector(`.albl[data-key="${drag.key}"]`); if(lbl) lbl.style.left=dayToX(drag.eOff+1)+'px'; });
document.addEventListener('mouseup',()=>{ if(!drag) return; barOverrides[drag.key]={s:offToIso(drag.sOff),e:offToIso(drag.eOff)}; saveOverrides(); drag=null; document.body.classList.remove('dragging'); render(); });
$('#langBtn').onclick=()=>{ lang = lang==='es'?'en':'es'; render(); };
$('#themeBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  $('#themeBtn').dataset.es = d?'☀️ Claro':'🌙 Oscuro';
  $('#themeBtn').dataset.en = d?'☀️ Light':'🌙 Dark';
  $('#themeBtn').textContent = lang==='es'?$('#themeBtn').dataset.es:$('#themeBtn').dataset.en;
};
loadState().then(()=>{ render(); if(EDITABLE && lastPublished) showPubStatus('Última publicación: '+fmtTs(lastPublished)); });
</script>
</body>
</html>
