<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Airways — Plan de Producción a Lanzamiento (31 Mar 2027)</title>
<style>
  :root{
    --label-w: 296px;
    --col-w: 70px;
    --bg: #ffffff;
    --panel: #f6f7f9;
    --grid: #e7e9ee;
    --gridStrong:#d3d7e0;
    --sep:#2b3240;
    --text: #1d2330;
    --muted: #6b7280;
    --today: rgba(255,196,0,.16);
    --todayLine:#f0a500;
    --row-h: 34px;
    /* workstream accents */
    --c-dev-a:#0f9d8f;  --c-dev-b:#2bc4b4;
    --c-art-a:#5b5bd6;  --c-art-b:#8a7bff;
    --c-mkt-a:#e08900;  --c-mkt-b:#ffb43d;
    --c-port-a:#d23b5a; --c-port-b:#ff6b84;
    --c-qa-a:#2e7d32;   --c-qa-b:#5bb85f;
    --c-sys-a:#2563c9;  --c-sys-b:#4f8bf0;
    --c-def-a:#c0398f;  --c-def-b:#e06bb0;
    --c-mile:#1d2330;
    --c-launch:#f0a500;
  }
  body.dark{
    --bg:#0f1420; --panel:#161c2b; --grid:#232b3d; --gridStrong:#2e3850;
    --text:#e7ecf5; --muted:#93a0b8; --today:rgba(255,196,0,.10); --sep:#aeb6c4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
  }
  .wrap{max-width:100%;margin:0 auto;padding:22px 20px 60px;}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
  .title h1{margin:0 0 4px;font-size:22px;letter-spacing:.2px;}
  .title .sub{color:var(--muted);font-size:13px;}
  .title .chip{display:inline-block;margin-top:8px;margin-right:6px;font-size:12px;font-weight:600;color:#fff;background:var(--c-launch);padding:3px 10px;border-radius:999px;}
  .title .chip.cd{background:var(--c-dev-a);}
  .legend.hidden{display:none;}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;}
  .filterbar .flabel{font-size:12px;font-weight:700;color:var(--muted);}
  .fchip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:1px solid var(--gridStrong);
    background:var(--panel);color:var(--text);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;}
  .fchip .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .fchip.on{border-color:var(--c-sys-a);}
  .fchip.off{opacity:.45;text-decoration:line-through;}
  .fchip.all{font-weight:700;}
  .controls{display:flex;gap:8px;align-items:center;}
  .btn{cursor:pointer;border:1px solid var(--gridStrong);background:var(--panel);color:var(--text);
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;transition:.15s;}
  .btn:hover{border-color:var(--c-art-a);}

  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:4px 0 14px;padding:11px 16px;
    font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--grid);border-radius:10px;}
  .legend .k{display:inline-flex;align-items:center;gap:6px;color:var(--muted);}
  .legend .sw{width:13px;height:13px;border-radius:4px;display:inline-block;}
  .sw.dev{background:linear-gradient(90deg,var(--c-dev-a),var(--c-dev-b));}
  .sw.art{background:linear-gradient(90deg,var(--c-art-a),var(--c-art-b));}
  .sw.mkt{background:linear-gradient(90deg,var(--c-mkt-a),var(--c-mkt-b));}
  .sw.port{background:linear-gradient(90deg,var(--c-port-a),var(--c-port-b));}
  .sw.qa{background:linear-gradient(90deg,var(--c-qa-a),var(--c-qa-b));}
  .sw.sys{background:linear-gradient(90deg,var(--c-sys-a),var(--c-sys-b));}
  .sw.def{background:linear-gradient(90deg,var(--c-def-a),var(--c-def-b));}
  .sw.snd{background:linear-gradient(90deg,#0ea5b7,#49c6d6);}
  .dmd{width:11px;height:11px;background:var(--c-mile);transform:rotate(45deg);display:inline-block;}

  .chart{border:1px solid var(--grid);border-radius:12px;background:var(--panel);overflow:auto;max-height:80vh;}
  .grid24{display:grid;grid-template-columns:var(--label-w) repeat(23,var(--col-w));width:max-content;min-width:100%;}
  /* sticky date header (stays fixed on vertical scroll) + fixed left name column (on horizontal scroll) */
  .stickyHead{position:sticky;top:0;z-index:20;background:var(--panel);width:max-content;min-width:100%;
    border-top-left-radius:12px;border-top-right-radius:12px;box-shadow:0 3px 6px rgba(0,0,0,.10);}
  .months .corner,.weeks .corner{position:sticky;left:0;z-index:23;background:var(--panel);}
  .months .cell{border-left:1px solid var(--grid);padding:8px 6px;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);background:var(--panel);}
  .months .corner{border-left:none;text-align:left;font-weight:700;color:var(--text);letter-spacing:.3px;font-size:12px;}
  /* week header */
  .weeks .cell{border-left:1px solid var(--grid);border-top:1px solid var(--grid);padding:5px 2px;text-align:center;font-size:9.5px;color:var(--muted);background:var(--panel);white-space:nowrap;}
  .weeks .corner{border-left:none;}
  .weeks .cell.today{background:var(--today);color:var(--todayLine);font-weight:700;}

  .grpTitle{grid-column:1 / -1;padding:7px 0;font-size:11px;font-weight:800;letter-spacing:.8px;
    color:var(--text);background:var(--grid);border-top:1px solid var(--gridStrong);cursor:pointer;}
  .grpTitle:hover{background:var(--gridStrong);}
  .grpTitle .gt{position:sticky;left:0;z-index:6;display:inline-block;padding-left:14px;padding-right:12px;background:var(--grid);}
  .grpTitle .gcaret{font-size:9px;color:var(--muted);margin-right:3px;}
  .row{min-height:var(--row-h);border-top:1px solid var(--grid);position:relative;}
  .row .name{grid-column:1;display:flex;align-items:center;padding:4px 10px 4px 14px;font-size:11.5px;line-height:1.2;
    position:sticky;left:0;z-index:8;background:var(--panel);border-right:1px solid var(--grid);}
  .row .name.warn::before{content:"⚠";margin-right:6px;}
  /* week separators as background */
  /* vertical column lines (week + day boundaries) drawn as overlays for exact alignment */
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--gridStrong);pointer-events:none;z-index:1;}
  .vline.day{opacity:.5;}
  .wkndcol{position:absolute;top:0;bottom:0;background:rgba(128,134,150,.15);pointer-events:none;z-index:0;}
  .blockedrow{position:absolute;left:var(--label-w);right:0;top:0;bottom:0;background:rgba(128,134,150,.22);pointer-events:none;z-index:1;}
  .row.lvl.blocked .name{color:var(--muted);}
  .bar{align-self:center;height:21px;border-radius:8px;display:flex;align-items:center;
    padding:0 8px;box-shadow:0 1px 2px rgba(0,0,0,.14);margin:5px 2px;z-index:2;overflow:hidden;}
  /* label inside a wide bar (white, fits) */
  .inlbl{color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inlbl.sm{font-size:9.5px;}
  /* full label beside a narrow bar (dark, never cut) */
  .outlbl{align-self:center;display:flex;align-items:center;font-size:10.5px;font-weight:500;
    color:var(--text);white-space:nowrap;z-index:1;pointer-events:none;}
  .outlbl.r{justify-self:start;padding-left:8px;}
  .outlbl.l{justify-self:end;padding-right:8px;text-align:right;}
  .outlbl.sm{font-size:9.5px;}
  .outlbl .dur{color:var(--muted);font-weight:600;margin-left:7px;font-size:9.5px;}
  .outlbl .ph{color:var(--muted);font-weight:600;}
  .bar.dev{background:linear-gradient(90deg,var(--c-dev-a),var(--c-dev-b));}
  .bar.art{background:linear-gradient(90deg,var(--c-art-a),var(--c-art-b));}
  .bar.mkt{background:linear-gradient(90deg,var(--c-mkt-a),var(--c-mkt-b));}
  .bar.port{background:linear-gradient(90deg,var(--c-port-a),var(--c-port-b));}
  .bar.qa{background:linear-gradient(90deg,var(--c-qa-a),var(--c-qa-b));}
  .bar.sys{background:linear-gradient(90deg,var(--c-sys-a),var(--c-sys-b));}
  .bar.def{background:linear-gradient(90deg,var(--c-def-a),var(--c-def-b));}
  .bar.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--gridStrong);}
  /* level rows: 3 steps (A layout+jugabilidad · Lock+def · B look&impl) */
  .row.lvl{min-height:38px;}
  .row.lvl .name{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding-top:5px;padding-bottom:5px;}
  .row.lvl .name strong{font-size:11.5px;}
  .row.lvl .name .mech{font-size:9px;color:var(--muted);line-height:1.1;}
  /* day-precise absolute bars (10px/day) + beside labels */
  .abar{position:absolute;top:50%;transform:translateY(-50%);height:19px;border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.16);z-index:2;display:flex;align-items:center;justify-content:center;}
  .abtxt{color:#fff;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;padding:0 7px;text-shadow:0 1px 1px rgba(0,0,0,.18);}
  .albl{position:absolute;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:500;color:var(--text);white-space:nowrap;z-index:1;pointer-events:none;padding-left:7px;opacity:0;transition:opacity .12s;}
  .albl .ph{color:var(--muted);font-weight:600;}
  .abar:hover + .albl{opacity:1;}
  /* resize handles on Fase A (green) bars */
  .handle{position:absolute;top:0;bottom:0;width:11px;cursor:ew-resize;z-index:4;}
  .handle.l{left:-3px;} .handle.r{right:-3px;}
  .handle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:11px;border-radius:2px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.2);}
  body.dragging{user-select:none;cursor:ew-resize;}
  /* expandable level name (caret) + difficulty sub-rows */
  .row.lvl .name.lvlname{flex-direction:row;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer;}
  .lvlname .caret{color:var(--muted);font-size:9px;display:inline-block;transition:transform .15s;flex:none;}
  .lvlname.open .caret{transform:rotate(90deg);}
  .lvlname .col{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .diffrow{min-height:28px;}
  .diffrow .name{padding-left:30px;font-size:10px;color:var(--muted);}
  .diffrow .name .dk{font-weight:800;color:var(--text);}
  /* nombre del modo en 2 sub-columnas: modo | fase */
  .row.lvl .name.twocol, .diffrow .name.twocol{padding:0;flex-direction:row;align-items:stretch;gap:0;}
  .name.twocol .nmode{width:172px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;gap:4px;padding:5px 8px;border-right:1px solid var(--gridStrong);box-sizing:border-box;overflow:hidden;}
  .name.twocol .nmode strong{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .name.twocol .nphase{flex:1;display:flex;align-items:center;justify-content:flex-start;padding:5px 8px;min-width:0;}
  /* nombre del modo abarcando (vertical) todo el bloque, centrado */
  .name.twocol .nmode.nm-span{position:absolute;top:0;left:0;z-index:9;overflow:hidden;
    background:linear-gradient(rgba(43,99,201,.09),rgba(43,99,201,.09)), var(--panel);}
  /* fila del modo colapsada a 0 cuando está desplegado (sin espacio arriba de la 1ª fase) */
  .row.lvl.spanning{min-height:0;}
  .row.lvl.spanning .nphase{padding:0;height:0;overflow:hidden;}
  .name.twocol .nphase .dk{font-size:10px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* bloque de un modo desplegado: fila pintada + bordes para separar modos */
  .row.lvl.exp-open, .diffrow.exp-open{background:rgba(43,99,201,.09);}
  .row.lvl.exp-open .name, .diffrow.exp-open .name{background:linear-gradient(rgba(43,99,201,.09),rgba(43,99,201,.09)), var(--panel);}
  .modeline{position:absolute;left:0;right:0;height:1px;background:var(--sep);z-index:13;pointer-events:none;}
  /* expandable weeks: click to widen a week and show its 7 days as sub-columns */
  .weeks .cell.wk{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .weeks .cell.wk:hover{background:var(--grid);}
  .weeks .cell.wk.exp{padding:0;background:rgba(43,99,201,.07);justify-content:flex-start;}
  .wnum{font-size:8px;font-weight:800;color:var(--c-sys-a);letter-spacing:.3px;}
  .wdate{font-size:9.5px;}
  .cell.wk.exp .wnum{width:100%;text-align:center;padding:3px 0;border-bottom:1px solid var(--grid);}
  .daygrid{display:grid;grid-template-columns:repeat(7,1fr);width:100%;}
  .daycell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;
    border-left:1px solid var(--grid);font-size:7.5px;color:var(--muted);line-height:1;}
  .daycell:first-child{border-left:none;}
  .daycell b{font-size:10px;color:var(--text);font-weight:700;}
  .daycell.wknd{background:rgba(128,134,150,.16);}
  .daycell.hol{background:rgba(240,165,0,.16);}
  .daycell.hol b{color:var(--c-launch);}
  .daycell.todayd{background:rgba(240,165,0,.24);}
  .daycell.todayd b{color:var(--todayLine);}
  /* current day highlighted inside an expanded week */
  .todaycol{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1;background:rgba(240,165,0,.16);
    border-left:2px solid var(--todayLine);border-right:1px solid var(--todayLine);}
  /* colored block for an expanded week across all rows, with day separators */
  .weekband{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0;
    background-color:rgba(43,99,201,.05);border-left:2px solid var(--c-sys-a);border-right:1px solid var(--gridStrong);}
  /* milestones: diamond icon with number on top, text below, all aligned */
  .mrow{min-height:104px;}
  .mrow .name{align-items:center;font-weight:800;letter-spacing:.4px;}
  .mrow::after{content:"";position:absolute;left:var(--label-w);right:0;top:22px;height:2px;background:var(--grid);z-index:0;}
  .mile{position:absolute;top:11px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:3;}
  .mile .d{width:22px;height:22px;transform:rotate(45deg);border-radius:5px;background:var(--c-mile);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);border:2px solid var(--panel);}
  .mile .d span{transform:rotate(-45deg);color:#fff;font-size:9.5px;font-weight:800;line-height:1;}
  .mile.event .d{background:var(--c-art-a);}
  .mile.event .t .mt{color:var(--c-art-a);font-weight:600;}
  /* tooltip con diseño (participantes de un milestone) — aparece al hover */
  .mile .d{cursor:help;}
  .mile .mtip{display:none;position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);
    background:#2b3240;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;line-height:1.3;
    padding:6px 10px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.32);z-index:60;pointer-events:none;}
  .mile .mtip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#2b3240;}
  .mile .mtip .tl{display:block;color:#ffd37a;font-size:9.5px;font-weight:700;letter-spacing:.3px;margin-bottom:2px;text-transform:uppercase;}
  .mile:hover .mtip{display:block;}
  .mile.launch .d{width:27px;height:27px;background:var(--c-launch);}
  .mile.launch .d span{font-size:13px;}
  .mile .t{margin-top:9px;text-align:center;font-size:10.5px;font-weight:400;color:var(--text);line-height:1.2;max-width:96px;}
  .mile .t.oneline{max-width:none;}
  .mile .t .mt{display:block;white-space:normal;}
  .mile .t.oneline .mt{white-space:nowrap;}
  .mile .t .ms{display:block;white-space:nowrap;font-weight:400;color:var(--muted);font-size:10px;margin-top:1px;}
  .mile.launch .t .mt{color:var(--c-launch);}
  /* milestones muy cercanos: texto ABAJO del número, anclado al borde del punto */
  .mile.edge .t{position:absolute;top:31px;margin-top:0;max-width:78px;}
  .mile.edge .t .mt{white-space:normal;}
  .mile.edge.side-l .t{right:11px;text-align:right;}
  .mile.edge.side-r .t{left:11px;text-align:left;}
  /* today vertical band across the whole chart */
  #rows{position:relative;}
  .todayband{position:absolute;top:0;bottom:0;width:var(--col-w);background:var(--today);
    border-left:2px solid var(--todayLine);pointer-events:none;z-index:1;}

  .notes{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
  .card{border:1px solid var(--grid);border-radius:12px;padding:14px 16px;background:var(--panel);}
  .card h3{margin:0 0 8px;font-size:13px;}
  .card.urgent{border-color:var(--c-port-a);}
  .card.urgent h3{color:var(--c-port-a);}
  .card.risk{border-color:var(--c-mkt-a);}
  .card.risk h3{color:var(--c-mkt-a);}
  .card ul{margin:0;padding-left:18px;}
  .card li{font-size:12px;line-height:1.5;margin-bottom:5px;color:var(--text);}
  .foot{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.5;}
  /* modal de reuniones */
  .mmodal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.45);padding:40px 16px;overflow:auto;}
  .mmodal.hidden{display:none;}
  .mmodal .mpanel{background:var(--bg);color:var(--text);border:1px solid var(--grid);border-radius:14px;max-width:660px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.4);overflow:hidden;}
  .mmodal .mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--grid);background:var(--panel);}
  .mmodal .mhead h2{margin:0;font-size:16px;letter-spacing:.2px;}
  .mmodal .mclose{cursor:pointer;border:1px solid var(--gridStrong);background:var(--bg);color:var(--text);font-size:14px;width:30px;height:30px;border-radius:8px;line-height:1;}
  .mmodal .mbody{padding:6px 20px 20px;max-height:72vh;overflow:auto;}
  .shotprog{font-size:12px;font-weight:700;color:var(--c-dev-a);margin:8px 0 2px;}
  .shotcat{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px;}
  .shotitem{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);}
  .shotitem input[type=checkbox]{margin-top:2px;width:16px;height:16px;cursor:pointer;flex:none;accent-color:var(--c-dev-a);}
  .shotitem .txt{flex:1;font-size:13px;line-height:1.3;}
  .shotitem.done .txt{text-decoration:line-through;color:var(--muted);}
  .shotitem a.txt{color:var(--c-sys-a);}
  .shotitem .lk{cursor:pointer;font-size:14px;opacity:.55;flex:none;}
  .shotitem .lk.has{opacity:1;}
  .shotitem .lk:hover{opacity:1;}
  .mdate{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:16px 0 8px;}
  .mcard{border:1px solid var(--grid);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--panel);}
  .mcard .mctop{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;}
  .mcard .mctop:hover{background:var(--grid);}
  .mcard .mtime{font-weight:800;font-size:13px;color:#fff;background:var(--c-sys-a);padding:3px 9px;border-radius:7px;white-space:nowrap;}
  .mcard .mtitle{font-weight:700;font-size:13px;flex:1;line-height:1.3;}
  .mcard .mcaret{color:var(--muted);font-size:11px;transition:transform .15s;}
  .mcard.open .mcaret{transform:rotate(90deg);}
  .mcard .mdetail{display:none;padding:4px 16px 16px;border-top:1px solid var(--grid);}
  .mcard.open .mdetail{display:block;}
  .matt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 4px;}
  .matt .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--grid);color:var(--text);}
  .matt .pill.req{background:var(--c-dev-a);color:#fff;}
  .matt .attlbl{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);width:100%;letter-spacing:.4px;margin:8px 0 1px;}
  .magenda{margin:10px 0 0;padding:0;list-style:none;}

function layoutModeNames(){
  const rowsEl=$('#rows');
  rowsEl.querySelectorAll('.modeline').forEach(e=>e.remove());
  const blocks=[];
  // pasada 1: aplicar colapso/estado (esto cambia las alturas)
  document.querySelectorAll('.row.lvl[data-lvl]').forEach(main=>{
    const nm=main.querySelector('.nmode'); if(!nm) return;
    const nameCell=main.querySelector('.name');
    const key=main.dataset.lvl;
    const phases=[...document.querySelectorAll('.diffrow[data-lvl]')].filter(p=>p.dataset.lvl===key && p.style.display!=='none');
    if(phases.length){ main.classList.add('spanning'); nm.classList.add('nm-span'); if(nameCell) nameCell.style.zIndex='12'; blocks.push({main,nm,phases}); }
    else { main.classList.remove('spanning'); nm.classList.remove('nm-span'); nm.style.height=''; if(nameCell) nameCell.style.zIndex=''; }
  });
  // pasada 2: medir ya colapsado y fijar alto del nombre + líneas divisorias
  const fullW=weekStartX(24); // ancho total (LABELW + todas las semanas) para que las líneas no se corten en el viewport
  blocks.forEach(({main,nm,phases})=>{
    const top=main.offsetTop;
    let bottom=top+main.offsetHeight;
    phases.forEach(p=>{ const b=p.offsetTop+p.offsetHeight; if(b>bottom) bottom=b; });
    nm.style.height=(bottom-top)+'px';
    const lt=document.createElement('div'); lt.className='modeline'; lt.style.top=top+'px'; lt.style.width=fullW+'px'; rowsEl.appendChild(lt);
    const lb=document.createElement('div'); lb.className='modeline'; lb.style.top=(bottom-1)+'px'; lb.style.width=fullW+'px'; rowsEl.appendChild(lb);
  });
}

function curOff(key,defS,defE){ const o=barOverrides[key]; return o?[dOff(o.s),dOff(o.e)]:[defS,defE]; }
function offToIso(off){ const d=new Date(START); d.setDate(d.getDate()+Math.max(0,Math.min(160,off))); return iso(d); }
function xToDay(x){ x-=LABELW; if(x<0)x=0; for(let w=1;w<=23;w++){ const ww=weekWidth(w); if(x<ww){ return (w-1)*7+Math.max(0,Math.min(6,Math.floor(x/(ww/7)))); } x-=ww; } return 160; }
// draw a stretchable bar (abar) with both-end handles; optional hover label to the right
function drawBar(key,defS,defE,grad,title,labelHtml,noDrag,inlbl){
  noDrag = noDrag || !EDITABLE;
  const [s,e]=curOff(key,defS,defE), p=barPx(s,e);
  const handles = noDrag?'':`<div class="handle l"></div><div class="handle r"></div>`;
  const inner = inlbl?`<span class="abtxt">${inlbl}</span>`:'';
  let h=`<div class="abar ${noDrag?'':'drag'}" data-key="${key}" data-soff="${s}" data-eoff="${e}" style="left:${p.l}px;width:${p.w}px;background:${grad}" title="${title}">${handles}${inner}</div>`;
  if(labelHtml) h+=`<div class="albl" data-key="${key}" style="left:${dayToX(e+1)}px">${labelHtml}</div>`;
  return h;
}

let drag=null;
document.addEventListener('mousedown',(e)=>{ const h=e.target.closest('.handle'); if(!h) return; const bar=h.closest('.abar'); if(!bar) return; e.preventDefault(); drag={key:bar.dataset.key,side:h.classList.contains('l')?'l':'r',sOff:+bar.dataset.soff,eOff:+bar.dataset.eoff,el:bar,before:JSON.stringify(barOverrides)}; document.body.classList.add('dragging'); });
document.addEventListener('mousemove',(e)=>{ if(!drag) return; const chart=$('.chart'), r=chart.getBoundingClientRect(); const x=e.clientX-r.left+chart.scrollLeft; const off=xToDay(x); if(drag.side==='l') drag.sOff=Math.min(off,drag.eOff); else drag.eOff=Math.max(off,drag.sOff); const p=barPx(drag.sOff,drag.eOff); drag.el.style.left=p.l+'px'; drag.el.style.width=p.w+'px'; drag.el.dataset.soff=drag.sOff; drag.el.dataset.eoff=drag.eOff; const lbl=document.querySelector(`.albl[data-key="${drag.key}"]`); if(lbl) lbl.style.left=dayToX(drag.eOff+1)+'px'; });
document.addEventListener('mouseup',()=>{ if(!drag) return; barOverrides[drag.key]={s:offToIso(drag.sOff),e:offToIso(drag.eOff)}; const after=JSON.stringify(barOverrides); if(drag.before && after!==drag.before){ undoStack.push(drag.before); if(undoStack.length>100) undoStack.shift(); redoStack.length=0; } saveOverrides(); drag=null; document.body.classList.remove('dragging'); render(); });
// deshacer / rehacer (Cmd/Ctrl+Z, Cmd/Ctrl+Shift+Z)
document.addEventListener('keydown',(e)=>{
  if(!EDITABLE) return;
  if(!(e.metaKey||e.ctrlKey) || (e.key!=='z'&&e.key!=='Z')) return;
  e.preventDefault();
  if(e.shiftKey){ if(redoStack.length){ undoStack.push(JSON.stringify(barOverrides)); barOverrides=JSON.parse(redoStack.pop()); saveOverrides(); render(); } }
  else { if(undoStack.length){ redoStack.push(JSON.stringify(barOverrides)); barOverrides=JSON.parse(undoStack.pop()); saveOverrides(); render(); } }
});
$('#langBtn').onclick=()=>{ lang = lang==='es'?'en':'es'; render(); renderMeetings(); renderShots(); };
$('#themeBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  $('#themeBtn').dataset.es = d?'☀️ Claro':'🌙 Oscuro';
  $('#themeBtn').dataset.en = d?'☀️ Light':'🌙 Dark';
  $('#themeBtn').textContent = lang==='es'?$('#themeBtn').dataset.es:$('#themeBtn').dataset.en;
};
// (prueba) arrancar con todos los modos desplegados en sus 4 fases
GROUPS.forEach(g=>{ if(g.kind==='levels') g.tasks.forEach(t=>{ if(!t.blocked) expandedLv.add(t.key); }); });
// por defecto, desplegar (mostrar días) las semanas con milestones o tareas de modos — se pueden colapsar con un clic
const wkOf=(iso)=>Math.floor(dOff(iso)/7)+1;
GROUPS.forEach(g=>{
  if(g.kind==='mile') g.tasks.forEach(t=>{ if(t.d) expandedWk.add(wkOf(t.d)); });
  if(g.kind==='levels') g.tasks.forEach(t=>{
    if(t.aStart){ for(let w=wkOf(t.aStart); w<=wkOf(t.aEnd); w++) expandedWk.add(w); }
    if(t.ph) t.ph.forEach(win=>{ for(let w=win[0]; w<=win[1]; w++) expandedWk.add(w); });
  });
});
// grupos colapsados por defecto (se abren con un clic)
GROUPS.forEach((g,gi)=>{ if(g.collapsed) collapsedGrp.add(gi); });
loadState().then(()=>{ render(); if(EDITABLE && lastPublished) showPubStatus('Última publicación: '+fmtTs(lastPublished)); });
</script>
